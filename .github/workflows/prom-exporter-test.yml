name: Check prometheus exporter work
on:
  push:
    branches: [ master, 'REL_*' ]
  pull_request:
    branches: [ master ]
    paths:
      - ".github/actions/test-logs/**"
      - ".github/workflows/prom-exporter-test.yml"
      - "docker/prom-exporter/**"
      - "prometheus/**"
      - "test/prom-exporter/**"
jobs:
  prom-exporter:
    name: prom-exporter
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Check prom exporter works
      shell: bash
      run: make prom-exporter-test 2>&1 | tee test-run.log
    - name: Save logs on failure
      if: failure()
      uses: ./.github/actions/test-logs
