name: Functional tests
on:
  push:
    branches: [ master, 'REL_*' ]
  pull_request:
    branches: [ master ]
    paths:
      - ".github/actions/test-logs/**"
      - ".github/workflows/functional-tests.yml"
      - "sources/**"
      - "test/**"
      - "CMakeLists.txt"
      - "docker/**"
      - "modules/**"
      - "cmake/**"
      - "!docker/prom-exporter/**"
      - "!test/prom-exporter/**"
      - "!sources/machinarium/gdb/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  functional:
    name: Functional
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build-type: ['build_release', 'build_asan', 'build_dbg']
        cc: ['clang', 'gcc']
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Odyssey functional tests
      shell: bash
      run: make functional-test ODYSSEY_BUILD_TYPE=${{ matrix.build-type }} ODYSSEY_CC=${{ matrix.cc }} 2>&1 | tee test-run.log
    - name: Save logs on failure
      if: failure()
      uses: ./.github/actions/test-logs
