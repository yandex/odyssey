name: Unit tests
on:
  push:
    branches: [ master, 'REL_*' ]
  pull_request:
    branches: [ master ]
    paths:
      - ".github/actions/test-logs/**"
      - ".github/workflows/unit-tests.yml"
      - "sources/**"
      - "test/**"
      - "CMakeLists.txt"
      - "docker/**"
      - "modules/**"
      - "cmake/**"
      - "!docker/prom-exporter/**"
      - "!test/prom-exporter/**"
      - "!sources/machinarium/gdb/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    # s390x is built and run under qemu emulation, which is much slower
    timeout-minutes: ${{ matrix.target-arch == 'linux/s390x' && 90 || 20 }}
    strategy:
      matrix:
        build-type: ['build_release', 'build_dbg', 'build_asan']
        target-arch: ['linux/amd64']
        cc: ['gcc', 'clang']
        include:
          # big-endian target without inline 128-bit CAS
          - build-type: 'build_release'
            target-arch: 'linux/s390x'
            cc: 'gcc'
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: qemu setup
      uses: docker/setup-qemu-action@v4
    - name: docker buildx
      uses: docker/setup-buildx-action@v4
    - name: Odyssey unit tests
      shell: bash
      run: make ci-unittests ODYSSEY_BUILD_TYPE=${{ matrix.build-type }} ODYSSEY_TEST_TARGET_PLATFORM=${{ matrix.target-arch }} ODYSSEY_CC=${{ matrix.cc }} 2>&1 | tee test-run.log
    - name: Save logs on failure
      if: failure()
      uses: ./.github/actions/test-logs

  unit-io-uring:
    name: unit (io_uring)
    # Run on the VM itself: Docker's default seccomp profile blocks io_uring.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bison flex libssl-dev liburing-dev pkg-config
    - name: Build unit tests with io_uring
      run: |
        cmake -S . -B build/ci-uring -DBUILD_IO_URING=ON
        cmake --build build/ci-uring --target odyssey_test --parallel 4
    - name: Run io_uring batch and poll tests
      shell: bash
      run: |
        build/ci-uring/sources/odyssey_test machinarium_test_uring 2>&1 | tee test-run.log
        # The test runner also exits successfully when its filter matches nothing.
        grep -q '^machinarium_test_uring_batch: ok' test-run.log
        grep -q '^machinarium_test_uring_poll: ok' test-run.log
    - name: Save logs on failure
      if: failure()
      uses: ./.github/actions/test-logs

  unit-compression:
    name: unit (compression)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: qemu setup
      uses: docker/setup-qemu-action@v4
    - name: docker buildx
      uses: docker/setup-buildx-action@v4
    - name: Odyssey unit tests with BUILD_COMPRESSION=ON
      shell: bash
      run: make ci-unittests ODYSSEY_CMAKE_EXTRA="-DBUILD_COMPRESSION=ON" 2>&1 | tee test-run.log
    - name: Save logs on failure
      if: failure()
      uses: ./.github/actions/test-logs
