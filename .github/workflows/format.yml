name: Format
on:
  push:
    branches: [ master, 'REL_*' ]
    paths-ignore:
      - "sources/machinarium/gdb/**"
  pull_request:
    branches: [ master ]
jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Check format
      run: make check-format
