pid_file "/var/run/odyssey.pid"
daemonize yes

unix_socket_dir "/tmp"
unix_socket_mode "0644"

log_format "%p %t %l [%i %s] (%c) %m\n"
log_to_stdout no
log_debug yes
log_config yes
log_session yes
log_query yes
log_stats no
log_file "/var/log/odyssey.log"

workers 1
resolvers 1

readahead 8192
nodelay yes

keepalive 15
keepalive_keep_interval 75
keepalive_probes 9
keepalive_usr_timeout 0

locks_dir "/tmp/odyssey"

graceful_die_on_errors yes
enable_online_restart yes
bindwith_reuseport yes

backend_connect_timeout_ms 2000

storage "live_storage" {
	type "remote"
	host "127.0.0.1"
	port 5432
}

storage "dead_storage" {
	type "remote"
	host "127.0.0.1"
	port 19999
}

storage "dead_storage2" {
	type "remote"
	host "127.0.0.1"
	port 19998
}


listen {
	host "*"
	port 6432
	backlog 128

	storage "dead_storage"
	storage "live_storage"
}

listen {
	host "*"
	port 7432
	backlog 128

	storage "live_storage"
	storage "dead_storage"
}

listen {
	host "*"
	port 8432
	backlog 128

	storage "dead_storage"
	storage "dead_storage2"
}

database "postgres" {
	user "postgres" {
		authentication "none"
		storage "dead_storage"

		pool "session"
		pool_size 10
		pool_timeout 5

		client_fwd_error yes

		server_lifetime 3600
		log_debug yes
	}
}

storage "local" {
	type "local"
}

database "console" {
	user default {
		authentication "none"
		role "admin"
		pool "session"
		storage "local"
	}
}
