# Global auth_query password cache options.
# Durations use the PostgreSQL GUC syntax; bare numbers are milliseconds.

auth_query_cache_ttl 10s
auth_query_cache_ttl_jitter 5s
auth_query_cache_error_retry 1s
auth_query_cache_stale_on_error yes
auth_query_timeout 500ms

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
}

storage "postgres_server" {
        type "remote"
        host "*"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
        }
}
