# Global auth_query password cache options: fail closed on refresh errors,
# no jitter, plain millisecond values.

auth_query_cache_ttl 30000
auth_query_cache_ttl_jitter 0
auth_query_cache_error_retry 250
auth_query_cache_stale_on_error no
auth_query_timeout 2000

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
}

storage "postgres_server" {
        type "remote"
        host "*"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
        }
}
