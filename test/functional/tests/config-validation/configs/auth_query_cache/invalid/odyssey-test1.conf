# expect-error: value for option 'auth_query_timeout' must be between 1 and 2147483647 ms
# auth_query_timeout must be at least 1 ms.

auth_query_timeout 0

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
}

storage "postgres_server" {
        type "remote"
        host "*"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
        }
}
