# expect-error: value for option 'workers' must be between 1 and 2147483647
workers 0

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        port 6432
        host "*"
}

storage "postgres_server" {
        type "remote"
        host "*"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
        }
}
