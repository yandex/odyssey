# expect-error: syntax error, unexpected STRING, expecting NUMBER
coroutine_stack_size "123"

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        port 6432
        host "*"
}

storage "postgres_server" {
        type "remote"
        host "*"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
        }
}
