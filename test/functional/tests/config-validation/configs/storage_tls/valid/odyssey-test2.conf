log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        port 6432
        host "*"
}

storage "postgres_server" {
        type "local"
        tls "allow"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
        }
}