# Units are case-sensitive, like in PostgreSQL.
log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
}

storage "postgres_server" {
        type "remote"
        host "*"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"

                pool_timeout 5S
        }
}
