# expect-error: value for option 'stats_interval' must be non-negative
# Negative values are not allowed for most time-valued options.
stats_interval -5

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
}

storage "postgres_server" {
        type "remote"
        host "*"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
        }
}
