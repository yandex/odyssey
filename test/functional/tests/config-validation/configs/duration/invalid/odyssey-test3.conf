# expect-error: value for option 'endpoints_status_poll_interval' must be between 1 and 2147483647 ms
# endpoints_status_poll_interval must be positive.
log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
}

storage "postgres_server" {
        type "remote"
        host "*"
        endpoints_status_poll_interval 0
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
        }
}
