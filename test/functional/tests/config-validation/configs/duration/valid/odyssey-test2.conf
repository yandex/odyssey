# Plain numeric values keep their historic units:
# seconds for stats_interval, server_lifetime, pool_ttl, catchup_timeout,
# keepalive and keepalive_keep_interval;
# milliseconds for the rest.

stats_interval 3
keepalive 15
keepalive_keep_interval 5
keepalive_usr_timeout 0
dns_cache_ttl 30000
group_checker_interval 7000

backend_connect_timeout_ms 20000
cancel_timeout_ms 1000
cancel_queue_timeout_ms -1

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
        client_login_timeout 15000
        catchup_timeout 3
}

storage "postgres_server" {
        type "remote"
        host "*"
        endpoints_status_poll_interval 1000
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"

                pool_timeout 0
                pool_ttl 60
                server_lifetime 3600
                pool_notice_after_waiting_ms 5000
                pool_client_idle_timeout 30
                pool_idle_in_transaction_timeout 15
                catchup_timeout 3
                keepalive 7200
                keepalive_usr_timeout -1
        }
}
