# Go-style duration values in time-valued options.
# Bare numbers keep the historic unit of each option; a duration suffix
# always overrides the unit.

stats_interval 60s
keepalive 15s
keepalive_keep_interval 5s
keepalive_usr_timeout -1
dns_cache_ttl 30s
group_checker_interval 7s

graceful_shutdown_timeout_ms 30s
backend_connect_timeout_ms 20s
cancel_timeout_ms 1s
cancel_queue_timeout_ms -1

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
        client_login_timeout 15s
        catchup_timeout 3s
}

storage "postgres_server" {
        type "remote"
        host "*"
        endpoints_status_poll_interval 1s
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"

                pool_timeout 5s
                pool_ttl 60s
                server_lifetime 1h
                pool_reset_timeout_ms 3s
                pool_notice_after_waiting_ms -1
                pool_client_idle_timeout 30s
                pool_idle_in_transaction_timeout 500ms
                catchup_timeout 3s
                keepalive 120s
        }
}
