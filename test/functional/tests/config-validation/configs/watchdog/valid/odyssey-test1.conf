unix_socket_dir "/tmp"
unix_socket_mode "0644"

log_format "%p %t %l [%i %s] (%c) %m\n"

pid_file "/var/run/odyssey.pid"
daemonize yes

log_to_stdout yes

workers 5
resolvers 1

listen {
	host "*"
	port 6432
	backlog 128
}

storage "postgres_server1" {
	type "remote"
	host "localhost"
	port 5433

	watchdog {
		authentication "none"
		storage "postgres_server1"
		storage_db "postgres"
		storage_user "postgres"

		pool_routing "internal"
		pool "transaction"
		pool_size 10

		watchdog_lag_query "SELECT TRUNC(EXTRACT(EPOCH FROM pg_last_xact_replay_timestamp()))"
		watchdog_lag_interval 1
	}
}

storage "postgres_server2" {
	type "remote"
	host "localhost"
	port 5434

	watchdog {
		authentication "none"
		storage "postgres_server2"
		storage_db "postgres"
		storage_user "postgres"

		pool_routing "internal"
		pool "transaction"
		pool_size 10

		watchdog_lag_query "SELECT TRUNC(EXTRACT(EPOCH FROM pg_last_xact_replay_timestamp()))"
		watchdog_lag_interval 1
	}
}

database default {
	user default {
		authentication "none"
		storage "postgres_server1"
		pool "transaction"
	}
}
