# expect-error: no rule storage is specified
unix_socket_dir "/tmp"
unix_socket_mode "0644"

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        port 6432
        host "*"
}

storage "postgres_server" {
        type "remote"
}

database "db" {
        user "user" {
                pool "session"
                authentication "none"
        }
}