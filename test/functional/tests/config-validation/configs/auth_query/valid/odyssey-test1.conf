unix_socket_dir "/tmp"
unix_socket_mode "0644"

log_format "%p %t %l [%i %s] (%c) %m\n"

listen {
        host "*"
        port 6432
}

storage "postgres_server" {
        type "remote"
}

database "db" {
        user "user" {
                storage "postgres_server"
                pool "session"
                authentication "none"
                auth_query "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
                auth_query_user "user"
                auth_query_db "db"
        }
}

database default {
        user default {
                storage "postgres_server"
                pool "session"
                authentication "none"
                pool_routing "internal"
        }
}
