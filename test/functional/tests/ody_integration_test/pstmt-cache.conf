pid_file "/var/run/odyssey.pid"
daemonize yes
log_format "%p %t %l [%i %s] (%c) %m\n"
log_to_stdout yes
log_file "/var/log/odyssey.log"
workers 2
resolvers 1
listen { host "127.0.0.1" port 6432 }
storage "postgres" { type "remote" host "127.0.0.1" port 5432 }
storage "fault" { type "remote" host "127.0.0.1" port 15432 }
database "pstmt_single" {
    user "postgres" {
        authentication "none"
        storage "postgres"
        storage_db "postgres"
        storage_user "postgres"
        pool "transaction"
        pool_size 1
        pool_timeout 5000
        pool_ttl 0
        pool_discard no
        pool_smart_discard no
        pool_cancel yes
        pool_rollback yes
        pool_reserve_prepared_statement yes
        server_pstmt_cache_size 2
        client_fwd_error yes
    }
}
database "pstmt_two" {
    user "postgres" {
        authentication "none"
        storage "postgres"
        storage_db "postgres"
        storage_user "postgres"
        pool "transaction"
        pool_size 2
        pool_timeout 5000
        pool_ttl 0
        pool_discard no
        pool_smart_discard no
        pool_cancel yes
        pool_rollback yes
        pool_reserve_prepared_statement yes
        server_pstmt_cache_size 2
        client_fwd_error yes
    }
}
database "pstmt_unlimited" {
    user "postgres" {
        authentication "none"
        storage "postgres"
        storage_db "postgres"
        storage_user "postgres"
        pool "transaction"
        pool_size 1
        pool_timeout 5000
        pool_ttl 0
        pool_discard no
        pool_smart_discard no
        pool_cancel yes
        pool_rollback yes
        pool_reserve_prepared_statement yes
        server_pstmt_cache_size 0
        client_fwd_error yes
    }
}
database "pstmt_fault" {
    user "postgres" {
        authentication "none"
        storage "fault"
        storage_db "postgres"
        storage_user "postgres"
        pool "transaction"
        pool_size 1
        pool_timeout 5000
        pool_ttl 0
        pool_discard no
        pool_smart_discard no
        pool_cancel yes
        pool_rollback yes
        pool_reserve_prepared_statement yes
        server_pstmt_cache_size 2
        client_fwd_error yes
    }
}
database "pstmt_bad_reset" {
    user "postgres" {
        authentication "none"
        storage "postgres"
        storage_db "postgres"
        storage_user "postgres"
        pool "transaction"
        pool_size 1
        pool_timeout 5000
        pool_ttl 0
        pool_discard no
        pool_smart_discard no
        pool_cancel yes
        pool_rollback yes
        pool_reserve_prepared_statement yes
        server_pstmt_cache_size 2
        client_fwd_error yes
        pool_discard_query "BEGIN"
    }
}
