daemonize no
workers 2
# Reload parsing with ASAN needs more space than the default system stack.
system_coroutine_stack_size 256
enable_online_restart no
bindwith_reuseport no
locks_dir "@WORK@"
log_format "%p %t %l (%c) %m\n"
log_to_stdout yes
log_debug yes
log_config no
log_stats no
group_checker_interval 100
hba_file "@WORK@/hba.conf"

listen {
    host "127.0.0.1"
    port @OD_PORT@
}
storage "local" {
    type "local"
}
storage "pg" {
    type "remote"
    host "127.0.0.1"
    port @PG_PORT@
}
database "console" {
    user "console" {
        authentication "none"
        role "admin"
        storage "local"
        pool "session"
    }
}
database "postgres" {
    user "postgres" {
        authentication "none"
        storage "pg"
        pool "session"
        pool_routing "internal"
    }
}
database "grouped" {
    group "members" {
        authentication "none"
        storage "pg"
        storage_db "postgres"
        storage_user "postgres"
        pool "session"
        pool_routing "client_visible"
        group_query "SELECT name FROM members"
        group_query_user "postgres"
        group_query_db "postgres"
    }
    user default {
        authentication "block"
        storage "pg"
        pool "session"
    }
}
database "grouped2" {
    group "members2" {
        authentication "none"
        storage "pg"
        storage_db "postgres"
        storage_user "postgres"
        pool "session"
        pool_routing "client_visible"
        group_query "SELECT name FROM members2"
        group_query_user "postgres"
        group_query_db "postgres"
    }
    user default {
        authentication "block"
        storage "pg"
        pool "session"
    }
}
