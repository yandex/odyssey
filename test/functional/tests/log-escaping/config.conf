daemonize yes
pid_file "/var/run/odyssey.pid"
locks_dir "/tmp/odyssey"
log_to_stdout no
log_file "/var/log/odyssey.log"
log_format "tskv\tuser=%u\tdb=%d\tapp=%a\tctx=%c\tmsg=%M\n"
log_async yes

listen {
	host "127.0.0.1"
	port 6432
}

storage "local" {
	type "local"
}

database "console" {
	user default {
		authentication "none"
		role "stat"
		pool "session"
		storage "local"
	}
}
