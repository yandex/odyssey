storage "postgres_server" {
	host "[127.0.0.1]:5432"
	type "remote"
}

database "db1" {
	user "user1" {
		authentication "none"
		storage "postgres_server"
		pool "session"
		pool_size 2
		pool_timeout 3000
	}
}

daemonize yes
pid_file "/var/run/odyssey.pid"

locks_dir "/tmp"

log_format "%p %t %l [%i %s] (%c) %m\n"
log_file "/var/log/odyssey.log"
log_to_stdout no
log_config yes
log_debug no
log_session yes
log_stats no
log_query no

listen {
	host "127.0.0.1"
	port 6432
}
