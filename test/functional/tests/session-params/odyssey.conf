daemonize yes
pid_file "/var/run/odyssey.pid"
log_format "%p %t %l (%c) %m\n"
log_file "/var/log/odyssey.log"
log_to_stdout no

listen {
	host "127.0.0.1"
	port 6432
}

storage "postgres" {
	type "remote"
	host "127.0.0.1:5432"
}

database "postgres" {
	user "session_params" {
		authentication "none"
		storage "postgres"
		storage_user "postgres"
		pool "session"
		pool_size 1
		pool_timeout 5000
	}
}
