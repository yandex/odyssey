pid_file "/var/run/odyssey.pid"
daemonize yes

unix_socket_dir "/tmp"
unix_socket_mode "0644"

log_format "%p %t %l [%i %s] (%c) %m\n"
log_file "/var/log/odyssey.log"
log_to_stdout no
log_config yes
log_session yes

locks_dir "/tmp/odyssey"

listen {
	host "*"
	port 6432
}

storage "postgres_server" {
	type "remote"
	host "localhost"
	port 5433

	watchdog {
		authentication "none"

#		broken_collation emits a WARNING on every connection (see bin/setup)
		storage "postgres_server"
		storage_db "broken_collation"
		storage_user "postgres"

		pool_routing "internal"
		pool "transaction"
		pool_size 10
		pool_timeout 0
		pool_ttl 1201
		pool_discard yes
		pool_cancel yes
		server_lifetime 1901

		watchdog_lag_query "SELECT TRUNC(EXTRACT(EPOCH FROM pg_last_xact_replay_timestamp()))"
		watchdog_lag_interval 1
	}
}

database "postgres" {
	user "user1" {
		authentication "none"
		storage "postgres_server"

		pool "transaction"
		pool_size 0
		pool_timeout 0

		catchup_timeout 5
	}
}
