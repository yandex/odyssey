daemonize yes
pid_file "/var/run/odyssey.pid"

unix_socket_dir "/tmp"
unix_socket_mode "0644"

locks_dir "/tmp"

log_format "%p %t %l [%i %s] (%c) %m\n"
log_file "/var/log/odyssey.log"
log_to_stdout no
log_config yes
log_debug no
log_session yes
log_stats no
log_query no

workers 1
resolvers 1

listen {
	host "127.0.0.1"
	port 6432
}

storage "postgres_server" {
	type "remote"
	host "127.0.0.1"
	port 5432
}

storage "local" {
	type "local"
}

database "postgres" {
	user "postgres" {
		authentication "none"
		storage "postgres_server"
		pool "session"
		pool_size 10
		pool_ttl 60
	}
	user "app" {
		authentication "none"
		storage "postgres_server"
		storage_user "postgres"
		pool "session"
		pool_size 5
		pool_ttl 60
	}
}

database "alias" {
	user "postgres" {
		authentication "none"
		storage "postgres_server"
		storage_db "postgres"
		pool "transaction"
		pool_size 7
	}
}

database "console" {
	user default {
		authentication "none"
		role "admin"
		pool "session"
		storage "local"
	}
}
