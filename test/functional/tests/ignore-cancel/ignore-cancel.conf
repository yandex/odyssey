storage "postgres_server" {
	type "remote"
	host "[127.0.0.1]:5432"
}

database "postgres" {
	user "postgres" {
		authentication "none"
		storage "postgres_server"
		pool "transaction"
		pool_size 20
	}
}

daemonize yes
pid_file "/var/run/odyssey.pid"

locks_dir "/tmp"

log_format "%p %t %l [%i %s] (%c) %m\n"
log_file "/var/log/odyssey.log"
log_to_stdout no
log_config yes
log_debug yes
log_session no
log_stats no
log_query no

listen {
	host "127.0.0.1"
	port 6432
}

ignore_cancel yes
