# Generated from PgBouncer. Review credentials and limits before use.
# This file contains auth_file secrets; restrict its permissions.
# Resolve these warnings before cutover. Unconvertible routes use authentication block.
# WARNING: pgbouncer.ini:0: database wildcard needs manual routing; default route blocked: *
# WARNING: pgbouncer.ini:0: unsupported database pool_mode; routes blocked: *
log_format "%p %t %l [%i %s] (%c) %m\n"
unix_socket_dir "/tmp"
unix_socket_mode "0777"
client_max 100

listen {
    host "127.0.0.1"
    port 6432
}

listen {
    port 6432
}

storage "pgb_1" {
    type "remote"
    host "localhost"
    port 5432
    tls "prefer"
}

database default {
    user "alice" {
        authentication "block"
        password "secret"
        storage "pgb_1"
        pool "session"
        pool_size 20
        min_pool_size 0
    }
}

storage "pgb_2" {
    type "remote"
    host "localhost"
    port 5432
    tls "prefer"
}

database "app" {
    user "alice" {
        authentication "md5"
        password "secret"
        storage "pgb_2"
        storage_db "app"
        pool "session"
        pool_size 7
        min_pool_size 0
    }
}
