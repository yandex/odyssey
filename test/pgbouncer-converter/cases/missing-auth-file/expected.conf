# Generated from PgBouncer. Review credentials and limits before use.
# This file contains auth_file secrets; restrict its permissions.
# Resolve these warnings before cutover. Unconvertible routes use authentication block.
# WARNING: pgbouncer.ini:0: no auth_file; user credentials must be configured manually, routes blocked: auth_file
log_format "%p %t %l [%i %s] (%c) %m\n"
unix_socket_dir "/tmp"
unix_socket_mode "0777"
client_max 100

listen {
    host "127.0.0.1"
    port 6432
}

listen {
    port 6432
}

storage "pgb_1" {
    type "remote"
    host "localhost"
    port 5432
    tls "prefer"
}

database "app" {
    user default {
        authentication "block"
        storage "pgb_1"
        storage_db "app"
        pool "session"
        pool_size 20
        min_pool_size 0
    }
}
