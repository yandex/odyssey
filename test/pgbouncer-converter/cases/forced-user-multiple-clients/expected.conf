# Generated from PgBouncer. Review credentials and limits before use.
# This file contains auth_file secrets; restrict its permissions.
# Resolve these warnings before cutover. Unconvertible routes use authentication block.
# WARNING: pgbouncer.ini:0: forced user with multiple client users would change pool size; routes blocked: app
log_format "%p %t %l [%i %s] (%c) %m\n"
unix_socket_dir "/tmp"
unix_socket_mode "0777"
client_max 100

listen {
    host "127.0.0.1"
    port 6432
}

listen {
    port 6432
}

storage "pgb_1" {
    type "remote"
    host "localhost"
    port 5432
    tls "prefer"
}

database "app" {
    user "alice" {
        authentication "block"
        password "first"
        storage "pgb_1"
        storage_db "app"
        storage_user "service"
        storage_password "secret"
        pool "session"
        pool_size 20
        min_pool_size 0
    }
    user "bob" {
        authentication "block"
        password "second"
        storage "pgb_1"
        storage_db "app"
        storage_user "service"
        storage_password "secret"
        pool "session"
        pool_size 20
        min_pool_size 0
    }
}
