# Generated from PgBouncer. Review credentials and limits before use.
# This file contains auth_file secrets; restrict its permissions.
log_format "%p %t %l [%i %s] (%c) %m\n"
unix_socket_dir "/tmp"
unix_socket_mode "0777"
client_max 100

listen {
    host "127.0.0.1"
    port 6432
}

listen {
    port 6432
}

storage "pgb_1" {
    type "remote"
    host "localhost"
    port 5432
    tls "prefer"
}

database "app" {
    user "alice" {
        authentication "md5"
        password "client secret"
        storage "pgb_1"
        storage_db "app data"
        storage_user "service"
        storage_password "secret with spaces"
        pool "session"
        pool_size 20
        min_pool_size 0
    }
}
