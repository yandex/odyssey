daemonize yes
log_file "/var/log/odyssey.log"
log_format "%m\n"
enable_online_restart no
bindwith_reuseport no

listen {
    host "127.0.0.1"
    port 6432
}

storage "local" {
    type "local"
}

database "console" {
    user "console" {
        authentication "none"
        role "admin"
        pool "session"
        storage "local"
    }
}
