include "/etc/odyssey/common.conf"

database default {
	user default {
		authentication "none"
		storage "postgres_server"
		pool "transaction"
		pool_size 10
		client_fwd_error yes
	}
}

database "console" {
	user "console" {
		authentication "none"
		role "admin"
		pool "session"
		storage "local"
	}
}