# minimal config for the bug-13 deterministic repro
#
# both routes must have pool_reserve_prepared_statement yes, otherwise
# the xplan path falls back to plan_simple() and no global pstmt entries
# are ever created
#
# the routes must be *independent* (different database rules): server
# pool cleanups are serialized per-route, so with a single route the
# first parked waiter would block the second server's cleanup forever

log_format "%p %t %l [%i %s] (%c) %m\n"
log_debug yes
log_to_stdout yes
unix_socket_dir "/tmp/bug13"
unix_socket_mode "0644"

listen {
	host "127.0.0.1"
	port 17102
}

storage "pg" {
	type "remote"
	host "127.0.0.1:17302"
}

storage "local" {
	type "local"
}

database "postgres" {
	user default {
		authentication "none"
		storage "pg"
		storage_user "postgres"
		pool "transaction"
		pool_size 8
		pool_timeout 0
		pool_discard yes
		pool_cancel yes
		pool_rollback yes
		pool_reserve_prepared_statement yes
		server_pstmt_cache_size 0
	}
}

database "simplex" {
	user default {
		authentication "none"
		storage "pg"
		storage_user "postgres"
		pool "transaction"
		pool_size 8
		pool_timeout 0
		pool_discard yes
		pool_cancel yes
		pool_rollback yes
		pool_reserve_prepared_statement yes
		server_pstmt_cache_size 4
	}
}

database "console" {
	user default {
		authentication "none"
		role "admin"
		pool "session"
		storage "local"
	}
}
